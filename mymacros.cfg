


# ====================================================================
# 1. MACRO PRINCIPAL DE PRÉ-AQUECIMENTO (COM PRESETS E MODO FORNO)
# ====================================================================
[gcode_macro PRE_AQUECER]
description: Pre-aquecimento inteligente para a K1 (Limites e nomes do Guilouz Script)
gcode:
    # Ler o parâmetro do preset enviado (Ex: PRESET=PLA)
    {% set PRESET = params.PRESET|default("")|string|upper %}

    # Configuração de temperaturas ideais (Mesa limitada a 100ºC para a K1)
    {% if PRESET == "PLA" %}
        {% set BED_TEMP = 60 %}
        {% set EXTRUDER_TEMP = 140 %}
        {% set CHAMBER_TEMP = 0 %}
    {% elif PRESET == "PETG" %}
        {% set BED_TEMP = 80 %}
        {% set EXTRUDER_TEMP = 150 %}
        {% set CHAMBER_TEMP = 0 %}
    {% elif PRESET == "TPU" %}
        {% set BED_TEMP = 55 %}
        {% set EXTRUDER_TEMP = 140 %}
        {% set CHAMBER_TEMP = 0 %}
    {% elif PRESET == "ABS" %}
        {% set BED_TEMP = 100 %}
        {% set EXTRUDER_TEMP = 160 %}
        {% set CHAMBER_TEMP = 55 %}
    {% elif PRESET == "ASA" %}
        {% set BED_TEMP = 100 %}
        {% set EXTRUDER_TEMP = 160 %}
        {% set CHAMBER_TEMP = 50 %}
    {% else %}
        # Valores manuais caso chame a macro sem escolher preset
        {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
        {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(140)|float %}
        {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(0)|float %}
    {% endif %}

    # Ativação do Modo Forno apenas para ABS e ASA (Guilouz Fans Nomenclature)
    {% if PRESET == "ABS" or PRESET == "ASA" %}
        M117 Modo Forno Ativado...
        SET_FAN_SPEED FAN=chamber_fan SPEED=0.0
        SET_FAN_SPEED FAN=auxiliary_fan SPEED=1.0
    {% else %}
        SET_FAN_SPEED FAN=auxiliary_fan SPEED=0.0
    {% endif %}

    # Iniciar o aquecimento simultâneo
    M117 A aquecer ({PRESET if PRESET else "Manual"})...
    M104 S{EXTRUDER_TEMP}
    M141 S{CHAMBER_TEMP}
    M190 S{BED_TEMP}
    
    # Aguardar ativamente que a câmara atinja o alvo (Apenas ABS/ASA)
    {% if CHAMBER_TEMP > 0 %}
        M117 Camara a aquecer...
        TEMPERATURE_WAIT SENSOR="chamber_temp" MINIMUM={CHAMBER_TEMP}
    {% endif %}

    # Desliga a recirculação após o alvo ser atingido para deixar o ambiente estável
    SET_FAN_SPEED FAN=auxiliary_fan SPEED=0.0
    M117 Pre-aquecimento concluido!

# ====================================================================
# 2. BOTÕES RÁPIDOS PARA A INTERFACE DO MAINSAIL
# ====================================================================
[gcode_macro PRE_AQUECER_PLA]
description: Pre-aquecer para PLA (60C Mesa / 140C Bico)
gcode: PRE_AQUECER PRESET=PLA

[gcode_macro PRE_AQUECER_PETG]
description: Pre-aquecer para PETG (80C Mesa / 150C Bico)
gcode: PRE_AQUECER PRESET=PETG

[gcode_macro PRE_AQUECER_TPU]
description: Pre-aquecer para TPU (55C Mesa / 140C Bico)
gcode: PRE_AQUECER PRESET=TPU

[gcode_macro PRE_AQUECER_ABS]
description: Pre-aquecer para ABS (100C Mesa / 160C Bico / 55C Camara)
gcode: PRE_AQUECER PRESET=ABS

[gcode_macro PRE_AQUECER_ASA]
description: Pre-aquecer para ASA (100C Mesa / 160C Bico / 50C Camara)
gcode: PRE_AQUECER PRESET=ASA



