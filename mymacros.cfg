[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
gcode:
    # 1. Definir temperaturas (Mesa: 80ºC / Nivelamento: 160ºC / Purga: 220ºC)
    {% set BED_TEMP = params.BED_TEMP|default(80)|float %}                
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(160)|float %}     
    {% set PURGE_TEMP = params.PURGE_TEMP|default(220)|float %}

    M117 A aquecer para Purga...
    # 2. Aquecer em simultâneo para a Purga (Mesa 80ºC e Bico 220ºC)
    M104 S{PURGE_TEMP}
    M190 S{BED_TEMP}
    M109 S{PURGE_TEMP}
    
    # 3. Fazer o Home se necessário antes da purga
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    
    # 4. LINHA DE PURGA ADAPTATIVA (Feita primeiro a 220ºC)
    M117 A fazer purga...
    LINE_PURGE
    
    # 5. ARREFECIMENTO DE SEGURANÇA (Prepara o bico para o teste)
    M117 A arrefecer o bico...
    G1 X10 Y10 Z10 F6000         # Afasta a cabeça para um canto seguro
    G92 E0                       
    M83                          
    G1 E-5 F300                  # Recolhe 5mm de filamento para criar vácuo no bico
    G92 E0
    M109 S{EXTRUDER_TEMP}        # Baixa o bico para 160ºC e ESPERA que estabilize
    
    # 6. AUTONIVELAMENTO 7x7 (Feito em segurança a 160ºC)
    M117 A criar malha 7x7...
    BED_MESH_CALIBRATE_BASE {rawparams}
    
    # 7. GRAVAÇÃO AUTOMÁTICA E REINÍCIO
    M117 A gravar mapa na memoria...
    SAVE_CONFIG



[gcode_macro PRE_AQUECER]
gcode:
    # 1. Definir temperaturas padrão (Mesa: 60ºC / Bico: 150ºC)
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(150)|float %}

    M117 A pre-aquecer...
    
    # 2. Iniciar aquecimento em simultâneo (sem bloquear os eixos)
    M104 S{EXTRUDER_TEMP}
    M190 S{BED_TEMP}
    
    M117 Pronta para imprimir!


[gcode_macro HOME_E_DESCER_MESA]
description: Faz home a todos os eixos e desce a mesa 100mm para dar espaco
gcode:
    M117 A fazer home...
    G28                          # 1. Faz o home a todos os eixos (X, Y, Z)
    
    M117 A posicionar a mesa...
    G91                          # 2. Ativa o modo relativo (as coordenadas passam a somar à posição atual)
    G1 Z100 F1200                # 3. Move o eixo Z 100mm para baixo a uma velocidade segura (F1200)
    G90                          # 4. Volta a ativar o modo absoluto (padrão do Klipper)
    
    M117 Mesa posicionada!



[gcode_macro DESLIGAR_AQUECIMENTO]
description: Desliga os aquecedores da mesa e do bico imediatamente
gcode:
    M117 A desligar aquecedores...
    M104 S0                      # 1. Define a temperatura do bico para 0ºC
    M140 S0                      # 2. Define a temperatura da mesa para 0ºC
    M117 Aquecedores desligados!



[gcode_macro START_PRINT]
gcode:
    # 1. Capturar as variáveis de temperatura e tamanho enviadas pelo OrcaSlicer
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    {% set AREA_START = params.AREA_START|default("5,5") %}
    {% set AREA_END = params.AREA_END|default("215,215") %}

    # 2. ORDEM DE CALOR PRIORITÁRIA (Aquece a mesa primeiro)
    M117 A aquecer a mesa...
    M104 S140                    # Bico a 140ºC (morna para o plástico amolecer mas não babar)
    M190 S{BED_TEMP}             # Liga a mesa e ESPERA atingir a temperatura total (ex: 80ºC)
    
    # 3. MOVIMENTOS EM QUENTE
    M117 A fazer Home em quente...
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                      # Faz o Home com a mesa já dilatada pelo calor definitivo
    {% endif %}
    
    # 4. AQUECIMENTO FINAL DO BICO
    M117 A aquecer o bico...
    M109 S{EXTRUDER_TEMP}        # Sobe o bico para a temperatura de impressão (ex: 200ºC) e espera
    
    # 5. AUTONIVELAMENTO ADAPTATIVO CORRIGIDO
    M117 A nivelar a zona da peca...
    BED_MESH_CALIBRATE AREA_START={AREA_START} AREA_END={AREA_END}
    
    M117 A iniciar impressao!