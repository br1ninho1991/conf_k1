[gcode_macro HOME_E_DESCER_MESA]
description: Faz home a todos os eixos e desce a mesa 100mm para dar espaco
gcode:
    M117 A fazer home...
    G28                          # 1. Faz o home a todos os eixos (X, Y, Z)
    
    M117 A posicionar a mesa...
    G91                          # 2. Ativa o modo relativo (as coordenadas passam a somar à posição atual)
    G1 Z100 F1200                # 3. Move o eixo Z 100mm para baixo a uma velocidade segura (F1200)
    G90                          # 4. Volta a ativar o modo absoluto (padrão do Klipper)
    
    M117 Mesa posicionada!

[gcode_macro ARREFECER]
description: Desliga os aquecedores e ativa o arrefecimento rapido e seguro da K1
gcode:
    M117 A desligar aquecedores...
    
    # 1. Desligar componentes de aquecimento
    M104 S0                      # Desliga o aquecedor do bico
    M140 S0                      # Desliga o aquecedor da mesa
    M141 S0                      # Desliga o alvo da camara (evita conflitos no Klipper)

    # 2. Gestao de Ventoinhas para Arrefecimento Rapido da K1
    M106 P0 S255                 # OBRIGATÓRIO: Liga a ventoinha do bico a 100% para evitar entupimentos (Heat Creep)
    #M106 P2 S255                 # Liga a ventoinha auxiliar lateral a 100% para arrefecer a mesa e a peça depressa
    M106 P3 S255                 # Liga o exaustor traseiro a 100% para renovar o ar da camara

    # 3. Mensagem de estado unificada (Evita que o Klipper atropele o texto)
    M117 Arrefecimento Activo!

[gcode_macro DESLIGAR_TUDO]
description: Desliga os aquecedores da mesa, bico e todas as ventoinhas da K1 em seguranca
gcode:
    # 1. Desligar componentes de aquecimento
    M104 S0                      # Define a temperatura do bico para 0ºC
    M140 S0                      # Define a temperatura da mesa para 0ºC
    M141 S0                      # Garante que desliga o alvo da câmara também

    # 2. Desligar ventoinhas de fluxo da camara
    M106 P2 S0                   # Desliga a ventoinha auxiliar lateral
    M106 P3 S0                   # Desliga o exaustor traseiro

    # 3. Gestao inteligente e segura da ventoinha do bico (P0)
    {% if printer.extruder.temperature > 50 %}
        M117 A arrefecer bico...
        M106 P0 S255             # Liga a ventoinha do bico a 100% para evitar entupimento
        TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=50 # Espera ativamente ate o bico baixar de 50ºC
    {% endif %}

    # 4. Finalizacao (Executa imediatamente se ja estiver frio ou logo apos atingir 50ºC)
    M106 P0 S0                   # Garante a ventoinha do bico a 0
    M117 Tudo Desligado!


# ====================================================================
# MACRO DE ENCERRAMENTO DEFINITIVA (CORTE IMEDIATO DO SHELLY)
# ====================================================================
# A. ROTINA DE VERIFICAÇÃO ATIVA DO ARREFECIMENTO (CORRE EM BACKGROUND)
# ====================================================================
[delayed_gcode _VERIFICAR_E_DESLIGAR]
gcode:
    # Se o bico ainda estiver acima de 50 graus, renova a verificação para daqui a 2 segundos
    {% if printer.extruder.temperature > 50 %}
        M117 A arrefecer... ({printer.extruder.temperature|int}C)
        UPDATE_DELAYED_GCODE ID=_VERIFICAR_E_DESLIGAR DURATION=2
    {% else %}
        # O BICO JÁ ESTÁ FRIO! Executa o encerramento em segurança:
        M117 Bico seguro! A desligar...
        M106 P0 S0                   # Desliga a ventoinha do bico (P0)
        
        # 1. Envia a ordem de corte ao Shelly (com o delay de 15s que tens ativo no moonraker.conf)
        {action_call_remote_method("set_device_power", device="Shelly", state="off")}
        
        # 2. Encerra o Linux da K1 no mesmo instante
        {action_call_remote_method("shutdown_machine")}
    {% endif %}

# ====================================================================
# B. BOTÃO PRINCIPAL NA INTERFACE DO MAINSAIL
# ====================================================================
[gcode_macro DESLIGAR_MAQUINA]
description: Garante o bico frio antes de acionar o fecho do Linux e o corte do Shelly
gcode:
    # 1. Corta imediatamente o aquecimento e componentes secundários
    M104 S0
    M140 S0
    M106 P2 S0                   # Desliga ventoinha auxiliar
    M106 P3 S0                   # Desliga exaustor
    
    # 2. Apaga a luz LED interna usando o pino original da K1 (Maiúsculas)
    SET_PIN PIN=LED VALUE=0

    # 3. Liga a ventoinha do bico (P0) a 100% para acelerar o arrefecimento
    M106 P0 S255

    # 4. Dispara o gatilho automático de verificação (inicia em 1 segundo)
    UPDATE_DELAYED_GCODE ID=_VERIFICAR_E_DESLIGAR DURATION=1


