[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
gcode:
    # 1. Definir temperaturas seguras para a K1
    {% set BED_TEMP = params.BED_TEMP|default(80)|float %}                #  80ºC temperatura da mesa
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(160)|float %}     # 140ºC evita que o filamento babe

    M117 A aquecer para nivelamento...
    
    # 2. Ligar os aquecedores e esperar que estabilizem
    M104 S{EXTRUDER_TEMP}
    M190 S{BED_TEMP}
    M109 S{EXTRUDER_TEMP}
    
    # 3. Fazer o Home se ainda não tiver sido feito
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    
    # 4. Chamar a calibração real com os parâmetros originais
    M117 A criar malha 7x7...
    BED_MESH_CALIBRATE_BASE {rawparams}
    
    # 5. Desligar os aquecedores no fim do teste manual
    M104 S0
    M140 S0
    M117 Calibracao concluida!


[gcode_macro PRE_AQUECER]
gcode:
    # 1. Definir temperaturas padrão (Mesa: 60ºC / Bico: 150ºC)
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(150)|float %}

    M117 A pre-aquecer...
    
    # 2. Iniciar aquecimento em simultâneo (sem bloquear os eixos)
    M104 S{EXTRUDER_TEMP}
    M190 S{BED_TEMP}
    
    M117 Pronta para imprimir!


[gcode_macro HOME_E_DESCER_MESA]
description: Faz home a todos os eixos e desce a mesa 100mm para dar espaco
gcode:
    M117 A fazer home...
    G28                          # 1. Faz o home a todos os eixos (X, Y, Z)
    
    M117 A posicionar a mesa...
    G91                          # 2. Ativa o modo relativo (as coordenadas passam a somar à posição atual)
    G1 Z100 F1200                # 3. Move o eixo Z 100mm para baixo a uma velocidade segura (F1200)
    G90                          # 4. Volta a ativar o modo absoluto (padrão do Klipper)
    
    M117 Mesa posicionada!