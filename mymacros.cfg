# ====================================================================
# 1. MACRO PRINCIPAL DE PRÉ-AQUECIMENTO (100% DISPARA E ESQUECE)
# ====================================================================
[gcode_macro PRE_AQUECER]
description: Pre-aquecimento inteligente e instantaneo para a K1 (Nativo Creality)
gcode:
    # Lê o material internamente sem expor uma caixa de texto ao utilizador
    {% set MATERIAL = params.MATERIAL|default("")|string|upper %}

    # Configuração de temperaturas ideais (Mesa limitada a 100ºC para a K1)
    {% if MATERIAL == "PLA" %}
        {% set BED_TEMP = 60 %}
        {% set EXTRUDER_TEMP = 140 %}
        {% set CHAMBER_TEMP = 0 %}
    {% elif MATERIAL == "PETG" %}
        {% set BED_TEMP = 80 %}
        {% set EXTRUDER_TEMP = 150 %}
        {% set CHAMBER_TEMP = 0 %}
    {% elif MATERIAL == "TPU" %}
        {% set BED_TEMP = 55 %}
        {% set EXTRUDER_TEMP = 140 %}
        {% set CHAMBER_TEMP = 0 %}
    {% elif MATERIAL == "ABS" %}
        {% set BED_TEMP = 100 %}
        {% set EXTRUDER_TEMP = 160 %}
        {% set CHAMBER_TEMP = 55 %}
    {% elif MATERIAL == "ASA" %}
        {% set BED_TEMP = 100 %}
        {% set EXTRUDER_TEMP = 160 %}
        {% set CHAMBER_TEMP = 50 %}
    {% else %}
        # Valores manuais caso a macro seja chamada individualmente
        {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
        {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(140)|float %}
        {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(0)|float %}
    {% endif %}

    # Ativação do Modo Forno apenas para ABS e ASA usando comandos nativos da K1
    {% if MATERIAL == "ABS" or MATERIAL == "ASA" %}
        M117 Modo Forno Ativado...
        M106 P3 S0    # Garante exaustor traseiro desligado
        M106 P2 S255  # Liga a ventoinha auxiliar lateral a 100% para recircular o calor
    {% else %}
        M106 P2 S0    # Garante ventoinha auxiliar desligada nos restantes materiais
    {% endif %}

    # Envia as ordens de aquecimento em simultâneo SEM BLOQUEAR (M140 em vez de M190)
    M104 S{EXTRUDER_TEMP}
    M141 S{CHAMBER_TEMP}
    M140 S{BED_TEMP}
    
    M117 Aquecimento iniciado ({MATERIAL if MATERIAL else "Manual"})!

# ====================================================================
# 2. BOTÕES RÁPIDOS PARA A INTERFACE DO MAINSAIL
# ====================================================================
[gcode_macro PRE_AQUECER_PLA]
description: Pre-aquecer para PLA (60C Mesa / 140C Bico)
gcode: PRE_AQUECER MATERIAL=PLA

[gcode_macro PRE_AQUECER_PETG]
description: Pre-aquecer para PETG (80C Mesa / 150C Bico)
gcode: PRE_AQUECER MATERIAL=PETG

[gcode_macro PRE_AQUECER_TPU]
description: Pre-aquecer para TPU (55C Mesa / 140C Bico)
gcode: PRE_AQUECER MATERIAL=TPU

[gcode_macro PRE_AQUECER_ABS]
description: Pre-aquecer para ABS (100C Mesa / 160C Bico / 55C Camara)
gcode: PRE_AQUECER MATERIAL=ABS

[gcode_macro PRE_AQUECER_ASA]
description: Pre-aquecer para ASA (100C Mesa / 160C Bico / 50C Camara)
gcode: PRE_AQUECER MATERIAL=ASA


[gcode_macro Retirar_Filamento]
description: Aquece o bico e remove o filamento com seguranca
gcode:
    {% set EXTRUDER_TEMP = params.TEMP|default(220)|int %}
    
    M117 Aaquecer para remover...
    M109 S{EXTRUDER_TEMP}          ; Espera o bico atingir a temperatura
    
    G91                            ; Posicionamento relativo
    G1 E10 F300                    ; Purga um pouco (10mm) para derreter a ponta
    G1 E-30 F1000                  ; Retracao rápida inicial (30mm)
    G1 E-50 F600                   ; Puxa o resto do filamento (50mm)
    G90                            ; Retorna ao posicionamento absoluto
    
    M104 S0                        ; Desliga o aquecimento do bico
    M117 Filamento removido!
    RESPOND MSG="Filamento removido!"

[gcode_macro Inserir_Filamento]
description: Aquece o bico e introduz o novo filamento
gcode:
    {% set EXTRUDER_TEMP = params.TEMP|default(220)|int %}
    
    M117 A aquecer para introduzir...
    RESPOND MSG="A aquecer para introduzir..."
    M109 S{EXTRUDER_TEMP}          ; Espera o bico atingir a temperatura
    RESPOND MSG="A carregar filamento..."
    G91                            ; Posicionamento relativo
    G1 E50 F300                    ; Puxa 50mm de filamento para dentro lentamente
    G1 E30 F150                    ; Purga mais 30mm bem devagar para limpar a cor antiga
    G90                            ; Retorna ao posicionamento absoluto
    
    M104 S0                        ; Desliga o aquecimento do bico
    M117 Filamento carregado!
    RESPOND MSG="Filamento carregado!"

